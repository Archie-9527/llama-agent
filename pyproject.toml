[project]
name = "llama-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python==0.3.19",
    "langgraph==1.2.8",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain==1.3.12",
    "pydantic>=2.9,<3.0",
    "jinja2>=3.1,<4.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.13,<5.0",
    "pyyaml>=6.0,<7.0",
    "psutil==7.2.2",
]
[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]
gpu = ["nvidia-ml-py>=12.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
llama-agent = "agent_core.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_core*"]

[tool.pytest.ini_options]
markers = [
    "real_model: opt-in integration test that loads a local GGUF model",
]
