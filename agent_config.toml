# llama-agent 默认配置文件
# 此文件会被 config.py 自动探测加载（搜索路径：当前目录、~/.config/llama-agent/）
# 命令行参数 > 环境变量 > 本文件 > 代码默认值

# ---------------------------------------------------------------------------
# 编排层 / CLI 层配置
# ---------------------------------------------------------------------------
[agent]
# 最大计划-反思循环次数（安全兜底，防止无限循环）
max_iterations = 6

# Checkpoint 数据库路径（持久化 AgentState，支持崩溃恢复与 resume）
db_path = "data/checkpoints.sqlite"

# 最近 thread_id 记录文件（用于免参数 resume）
last_thread_file = "data/last_thread_id.txt"

# 日志级别：DEBUG / INFO / WARNING / ERROR
log_level = "INFO"

# 外部多轮会话存储和原文历史预算（Baseline 不做摘要）
conversation_db_path = "data/conversations.sqlite"
last_conversation_file = "data/last_conversation_id.txt"
conversation_history_turns = 8
conversation_history_token_budget = 4096

# ---------------------------------------------------------------------------
# 全屏交互式 CLI（llama-agent cli）
# ---------------------------------------------------------------------------
[tui]
# 仅控制是否展示模型返回的原始 Thinking；是否生成 Thinking 仍由
# engine.disable_thinking 控制。
show_thinking = false
thinking_max_chars = 8000
show_sidebar = true
refresh_interval_ms = 300
tool_result_preview_chars = 500
restore_last_conversation = true
# TUI 运行时不能向终端直接打印日志，否则会破坏全屏布局。
log_file = "data/llama-agent-tui.log"

# ---------------------------------------------------------------------------
# 推理内核配置（映射到 ChatLlamaCpp / llama-cpp-python 构造参数）
# ---------------------------------------------------------------------------
[engine]
# [必填] GGUF 模型文件路径
model_path = "/root/autodl-tmp/llama-agent/src/tests/models/Qwen3VL-8B-Instruct-Q8_0.gguf"

# 上下文窗口大小（token 数）
n_ctx = 20000

# GPU 层数（0 = 纯CPU；-1 = 全部offload到GPU）
n_gpu_layers = -1

# 批处理大小
n_batch = 512

# CPU 线程数
n_threads = 8

# 对话模板格式（chatml / llama-2 / mistral 等）
chat_format = "chatml-function-calling"

# 采样温度（0.0 = 贪婪解码，越高越随机）
temperature = 0.2

# Top-p（nucleus）采样
top_p = 0.9

# Top-k 采样
top_k = 40

# 重复惩罚
repeat_penalty = 1.1

# 单次推理最大生成 token 数
max_tokens = 512

# 采样随机种子；Benchmark 会按 suite.seed + repetition 覆盖。
# -1 表示普通运行时由 llama.cpp 随机选择。
seed = -1

# 是否启用 verbose 日志（大量 llama.cpp 内部输出）
verbose = false

# 单次推理超时时间（秒）
request_timeout = 60.0

# Qwen3/Qwen3.5 会默认输出思考过程；Agent 节点只需要最终结构或答案。
disable_thinking = true

[tools]
enabled_tools = [
  "execute_shell_command",
  "count_lines",
  "get_file_metadata",
  "read_file",
  "search_file",
  "aggregate_log_errors",
  "search_log",
  "get_log_window",
  "describe_sqlite_table",
  "query_sqlite",
  "get_artifact_summary",
  "retrieve_artifact",
  "search_artifact",
]

[tools.providers.shell]
# R0 的大型工具输出工作负载需要保留原始输出；后续 R1 将由 ArtifactStore
# 取代直接内联。安全性仍由命令白名单、shell=False 和 timeout 保证。
max_output_chars = 300000

[tools.providers.skills]
skills_dir = "src/agent_core/capabilities/skills"

[tools.providers.file]
allowed_roots = ["."]
max_read_chars = 300000
max_matches = 50

[tools.providers.log]
allowed_roots = ["."]
max_matches = 50
max_window_lines = 40

[tools.providers.sqlite]
allowed_roots = ["."]
max_rows = 100

[tools.providers.artifact]
storage_dir = "data/artifacts"
max_retrieve_bytes = 8192
max_search_matches = 10

# ---------------------------------------------------------------------------
# Benchmark/运行时遥测。普通 run 默认关闭，benchmark worker 会强制开启。
# ---------------------------------------------------------------------------
[telemetry]
enabled = false
output_dir = "benchmark/results/runtime"
sample_interval_ms = 200
collect_process = true
collect_kv = true
collect_accelerator = true
# 状态大小查询可能较慢，R0 默认关闭，专项实验时开启。
collect_state_size = false

[memory]
# R1：超过阈值的工具结果存入 ArtifactStore，仅把摘要、首尾预览和引用送入模型。
# false 时完全保持 R0 行为；也可通过 AGENT_MEMORY_ARTIFACT_VIRTUALIZATION 覆盖。
artifact_virtualization = false
artifact_inline_max_bytes = 8192
artifact_preview_chars = 1200
artifact_summary_chars = 600
lifecycle_context = false
# R2：活动上下文采用 PINNED/HOT/WARM/COLD/DEAD 生命周期管理。
# Benchmark worker 会把 context_store_path 重定向到每个样本的独立目录。
context_store_path = "data/context_memory.sqlite"
context_budget_tokens = 12000
# 历史上下文低于该值时沿用 R1 原文历史，不启动 R2 检索。
context_activation_tokens = 2048
context_trigger_ratio = 0.75
context_reserved_generation_tokens = 1024
# 单条记录至少达到该大小且压缩率达到阈值才外置，避免小记录负优化。
context_min_compaction_bytes = 2048
context_min_compaction_ratio = 0.30
hot_execution_records = 4
hot_conversation_turns = 4
hot_reflection_notes = 2
summary_mode = "deterministic"
summary_trigger_tokens = 6000
summary_target_chars = 800
context_retrieval_top_k = 3
context_retrieval_token_budget = 2000
checkpoint_compaction = true
kv_lifecycle = false
branch_management = false
