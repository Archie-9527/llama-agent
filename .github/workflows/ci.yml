name: CI

on:
  push:
    branches: [agent-dev, main]
  pull_request:
  workflow_dispatch:  # allow manual trigger

# ---------------------------------------------------------------------------
# Concurrency: cancel in-progress runs on the same PR to save CI minutes
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # ===========================================================================
  # 1. Lint-only job — fast feedback (~30 s), runs on a single Python version
  # ===========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: |
          ruff check \
            agent-wrapper/llama_agent \
            llama-cpp-python/llama_cpp

      - name: Ruff format (check only)
        run: |
          ruff format --check \
            agent-wrapper/llama_agent \
            llama-cpp-python/llama_cpp

  # ===========================================================================
  # 2. Build + test matrix  (Linux, macOS, Windows)
  # ===========================================================================
  build-and-test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows: test a representative Python version only (CI time)
          - os: windows-latest
            python-version: "3.12"

    env:
      # Tell cmake where Python lives (avoids mixed-toolchain issues on Windows)
      Python_EXECUTABLE: ${{ matrix.os == 'windows-latest' && 'python' || '' }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------------------------------------------------
      # System dependencies
      # -----------------------------------------------------------------------
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja --no-progress

      # -----------------------------------------------------------------------
      # Install Python dependencies
      # -----------------------------------------------------------------------
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Install core packages in editable mode
          pip install -e langchain/libs/core
          pip install -e langchain/libs/langchain_v1
          pip install -e llama-cpp-python
          pip install -e .

          # Install test dependencies
          pip install ".[test]"

      # -----------------------------------------------------------------------
      # CMake configure & build (native llama.cpp libs)
      # -----------------------------------------------------------------------
      - name: CMake configure
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLLAMA_AGENT_BUILD_NATIVE=ON
          -DPYTHON_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}

      - name: CMake build
        run: cmake --build build --config Release --parallel

      - name: CMake install
        run: cmake --install build --prefix build/install --config Release

      # -----------------------------------------------------------------------
      # Smoke test: verify llama_cpp can be imported and loads libs
      # -----------------------------------------------------------------------
      - name: Smoke test — import
        run: |
          python -c "
          import llama_cpp
          print('llama_cpp version:', llama_cpp.__version__)
          print('Library loaded OK')
          "

      # -----------------------------------------------------------------------
      # Run Python tests  (skip integration tests that need model files)
      # -----------------------------------------------------------------------
      - name: Unit tests
        run: |
          pytest agent-wrapper/tests/ \
            -v --tb=short \
            -m "not integration" \
            --timeout 120 \
            || echo "::warning::Some tests skipped (no model file available)"

  # ===========================================================================
  # 3. mypy type-check  (separate from lint for clarity)
  # ===========================================================================
  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e langchain/libs/core
          pip install -e langchain/libs/langchain_v1
          pip install -e llama-cpp-python
          pip install -e ".[typing,test]"

      - name: Run mypy
        run: |
          mypy agent-wrapper/llama_agent --ignore-missing-imports

  # ===========================================================================
  # 4. CTest for CMake-registered tests
  # ===========================================================================
  ctest:
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e langchain/libs/core
          pip install -e langchain/libs/langchain_v1
          pip install -e llama-cpp-python
          pip install -e ".[test]"

      - name: System deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: CMake configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        run: cmake --build build --parallel

      - name: CTest
        run: cd build && ctest --output-on-failure
